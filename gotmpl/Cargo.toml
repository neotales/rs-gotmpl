[package]
name = "neotales-gotmpl"
description = "Pure, safe Go text/template parsing and rendering, with the function map supplied by the caller"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-gotmpl"
authors = ["x0craft"]
readme = "README.md"
keywords = ["template", "gotemplate", "go", "helm", "text-template"]
categories = ["template-engine", "text-processing", "parser-implementations"]

[dev-dependencies]
# The tests load a real helper set the way the neotales-sprig README shows, and
# the parity suite compares this engine against those helpers. A dev-dependency
# is the only edge between the two crates: neither published library depends on
# the other, which is the direction Go's text/template and Sprig keep.
#
# The path carries no version on purpose. Cargo drops a path-only dev-dependency
# from the packaged manifest, so a crate whose sibling is not on crates.io yet
# can still be published; the tests and doctests keep working from the checkout.
neotales-sprig = { path = "../sprig" }
adapter = { path = "../adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
