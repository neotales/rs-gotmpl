name: release

# Publishing is driven by a tag, never by a branch. The tag must equal `v` plus
# the version in Cargo.toml, so the thing that ran is a thing that can be named.
#
# Trusted publishing: the publish job asks crates.io for a short-lived token
# over OIDC. There is no CARGO_REGISTRY_TOKEN secret in this repository.
# crates.io cannot bootstrap a crate this way. The first publish of a new crate
# is manual, through ~/work/rs/publish.sh. See RELEASE.md.
#
# The publish job sets no GitHub environment on purpose. The trusted publisher
# saved on crates.io for this organisation has an empty environment, and
# crates.io compares that field with the job's, so an environment on either side
# alone fails the token exchange.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Runs on both triggers. On workflow_dispatch this job is the whole release:
  # checks and a `cargo publish --dry-run`, never a real publish.
  #
  # Only gotmpl is dry-run here. Sprig names gotmpl as an optional dependency by
  # version, so its packaging resolves gotmpl from crates.io, where this version
  # is not published until the publish job uploads it. Sprig is dry-run there,
  # immediately before its upload. See RELEASE.md.
  check:
    name: pre-publish checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release

      # `cargo fmt` takes `--all`, which is the workspace spelling; it has no
      # `--workspace` flag.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      # `--all-targets` does not run doctests, and the README samples are the
      # supported glue for both crates.
      - name: Doctests
        run: cargo test --workspace --doc --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

      # gotmpl has no published dependency on sprig, so it packages on its own.
      # Sprig cannot be dry-run until this version is uploaded; see RELEASE.md.
      - name: Package without publishing
        run: cargo publish -p neotales-gotmpl --dry-run --locked

  version:
    name: tag matches the crate version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with both manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          manifests = {
              "neotales-gotmpl": "gotmpl/Cargo.toml",
              "neotales-sprig": "sprig/Cargo.toml",
          }

          versions = {}
          for name, path in manifests.items():
              with open(path, "rb") as handle:
                  package = tomllib.load(handle).get("package")
              if not isinstance(package, dict):
                  sys.exit(f"{path} has no [package] table")
              version = package.get("version")
              if not isinstance(version, str):
                  sys.exit(
                      f"{path} [package] version is not a literal string. "
                      "Each crate must carry the published version."
                  )
              versions[name] = version

          tag = os.environ["TAG"]
          print(f"tag: {tag}")
          for name, version in versions.items():
              print(f"{name}: {version}")

          distinct = set(versions.values())
          if len(distinct) != 1:
              print(f"::error::the crates carry different versions: {versions}")
              sys.exit(1)

          expected = f"v{distinct.pop()}"
          if tag != expected:
              print(f"::error::tag {tag} does not match {expected}")
              sys.exit(1)
          PY

  publish:
    name: publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No GitHub environment, deliberately. The trusted publisher stored on
    # crates.io for this organisation has an empty environment, and crates.io
    # compares that field with the job's. Setting `environment: release` here
    # makes the OIDC token exchange fail with no other symptom. If someone ever
    # does set an environment name on crates.io, this job must set that exact
    # name. See RELEASE.md.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-publish

      # Fails when the crate does not exist on crates.io yet, or when the
      # trusted publisher does not match this repository, this workflow file and
      # an empty environment. That is the intended failure: there is nothing to
      # fall back to, and no token to widen. See RELEASE.md for the first
      # publish.
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Sprig's `gotmpl` feature names this crate as an optional dependency by
      # version, so it has to be on crates.io before sprig can be packaged. Skip
      # the upload when a re-run finds the version already there: that is what
      # makes a run that failed on sprig, usually to index lag, re-runnable.
      - name: Publish the template crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eu
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("gotmpl/Cargo.toml", "rb"))["package"]["version"])')
          published=$(cargo search neotales-gotmpl --limit 1 2>/dev/null | head -n 1 || true)
          case "${published}" in
            "neotales-gotmpl = \"${version}\""*)
              echo "neotales-gotmpl ${version} is already on crates.io; skipping the upload."
              ;;
            *)
              cargo publish -p neotales-gotmpl --locked
              ;;
          esac

      # Now that the version it names exists, sprig can be packaged and checked
      # the way the check job checks gotmpl. The dry run can still fail while the
      # index has not caught up with the upload above; re-running the job is the
      # fix. See RELEASE.md.
      - name: Package the helper crate without publishing
        run: cargo publish -p neotales-sprig --dry-run --locked

      - name: Publish the helper crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p neotales-sprig --locked
