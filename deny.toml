# Supply chain policy for this repository.
#
# Copied from the plab rs-lib workspace with the two RUSTSEC ignores removed.
# Those entries name neotales-x509 and neotales-docker-compose, which are not in
# this repository, so keeping them here would pre-approve an advisory for a
# crate that may later pull the same dependency for a different reason. An
# ignore belongs in the repository it was reasoned about.
#
# If this crate needs an ignore, add it here with a reason and a delete
# condition, and never as a way to make a red build green. `cargo audit` reads
# no config file, so the same ignore must also be repeated in audit.yml as an
# `--ignore` flag. Two places, one reason: the reason and the delete condition
# live here, next to the graph they were reasoned about.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "transitive"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The three crates reference each other by path with no version on purpose:
#
#   adapter/Cargo.toml  neotales-gotmpl, neotales-sprig  (adapter is publish = false)
#   gotmpl/Cargo.toml   neotales-sprig, adapter          ([dev-dependencies])
#   sprig/Cargo.toml    neotales-gotmpl, adapter         ([dev-dependencies])
#
# A path with no version is what keeps a dev-dependency out of the packaged
# manifest: `cargo package` drops it, so each published crate names no sibling
# and the two can be published in either order. Putting `version =
# "=0.0.0-alpha.0"` beside the path keeps the edge in the packaged manifest as
# a registry requirement, and `cargo publish --dry-run` then stops at
# `failed to select a version for the requirement \`adapter = "=0.0.0-alpha.0"\``
# because none of these crates are on crates.io, and adapter never will be.
#
# This is cargo-deny's documented exception for that case: a path dependency of
# a private crate, and a path dev-dependency in any crate, is not counted as a
# wildcard. It is not a blanket allowance. A path dependency in a public
# crate's [dependencies] is still denied, so a real runtime edge from
# neotales-gotmpl to neotales-sprig is still caught, which is the dependency
# this workspace deliberately does not have.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
