[package]
name = "neotales-sprig"
description = "Safe, deterministic Sprig-compatible template helper functions, with no clock, randomness or filesystem access"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-gotmpl"
authors = ["x0craft"]
readme = "README.md"
keywords = ["template", "sprig", "helm", "go", "helpers"]
categories = ["template-engine", "text-processing"]

[dependencies]
# Off by default: a default build of this crate names no template engine. The
# `gotmpl` feature turns on the glue that loads these helpers into
# `neotales-gotmpl`, so a caller does not have to keep its own copy of the
# conversion.
neotales-gotmpl = { path = "../gotmpl", version = "0.0.0-alpha.0", optional = true }

[features]
# `register`, `register_group`, and `register_hermetic`.
gotmpl = ["dep:neotales-gotmpl"]

[lints]
workspace = true
