[package]
name = "neotales-sprig"
description = "Safe, deterministic Sprig-compatible template helper functions, with no clock, randomness or filesystem access"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-gotmpl"
authors = ["x0craft"]
readme = "README.md"
keywords = ["template", "sprig", "helm", "go", "helpers"]
categories = ["template-engine", "text-processing"]

[dev-dependencies]
# The README's load-into-a-template sample is compiled as a doctest, so the
# template crate is needed here to show the glue. It is a dev-dependency: this
# library compiles and publishes with no knowledge of any engine.
#
# The path carries no version on purpose. Cargo drops a path-only dev-dependency
# from the packaged manifest, so this crate can be published before the template
# crate exists on crates.io; the doctest keeps working from the checkout.
neotales-gotmpl = { path = "../gotmpl" }

[lints]
workspace = true
