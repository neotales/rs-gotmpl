[package]
name = "neotales-sprig"
description = "Safe, deterministic Sprig-compatible template helper functions, with no clock, randomness or filesystem access"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-gotmpl"
authors = ["x0craft"]
readme = "README.md"
keywords = ["template", "sprig", "helm", "go", "helpers"]
categories = ["template-engine", "text-processing"]

[dev-dependencies]
# The README sample loads this helper set into `neotales-gotmpl`, so the engine
# and the shared value adapter are needed to compile the doctest. Both are
# path-only, which cargo drops from the packaged manifest: this library's
# published graph names no engine.
neotales-gotmpl = { path = "../gotmpl" }
adapter = { path = "../adapter" }

[lints]
workspace = true
